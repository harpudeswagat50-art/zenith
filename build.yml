name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Android project around index.html
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/batcomputer/studytracker app/src/main/res/values
          cp index.html app/src/main/assets/index.html
          cat > settings.gradle <<'EOT'
          rootProject.name = "Zenith"
          include ':app'
          EOT
          cat > build.gradle <<'EOT'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOT
          cat > gradle.properties <<'EOT'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOT
          cat > app/build.gradle <<'EOT'
          apply plugin: 'com.android.application'
          android {
              namespace 'com.batcomputer.studytracker'
              compileSdk 34
              defaultConfig {
                  applicationId "com.batcomputer.zenith"
                  minSdk 21
                  targetSdk 34
                  versionCode 2
                  versionName "1.1"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOT
          cat > app/src/main/res/values/strings.xml <<'EOT'
          <resources><string name="app_name">Zenith</string></resources>
          EOT
          cat > app/src/main/AndroidManifest.xml <<'EOT'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:allowBackup="true" android:label="Zenith" android:theme="@android:style/Theme.NoTitleBar">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOT
          cat > app/src/main/java/com/batcomputer/studytracker/MainActivity.java <<'EOT'
          package com.batcomputer.studytracker;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          public class MainActivity extends Activity {
              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  WebView w = new WebView(this);
                  setContentView(w);
                  WebSettings s = w.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  w.loadUrl("file:///android_asset/index.html");
              }
          }
          EOT
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Zenith-APK
          path: app/build/outputs/apk/debug/*.apk
